include:
  - analytics/compose.yml
name: learnhouse
services:
  learnhouse-app:
    image: sirius-lms:latest   # deploy.sh rewrites this to sirius-lms:<git sha>
    restart: unless-stopped
    env_file: [.env]
    environment:
      - HOSTNAME=0.0.0.0
      - LEARNHOUSE_API_URL=http://localhost:9000
    ports: ["127.0.0.1:8081:80"]   # only the HTTPS proxy (caddy) is public
    volumes: [content:/app/api/content]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD","curl","-f","http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      learnhouse-app: {condition: service_healthy}
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: [.env]
    volumes: [db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U learnhouse"]
      interval: 5s
      timeout: 4s
      retries: 5
  redis:
    image: redis:7.2.3-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 4s
      retries: 5
volumes:
  content:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
