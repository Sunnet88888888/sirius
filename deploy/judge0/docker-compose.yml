# Code-execution sandbox for code tasks. Joins the platform's network (learnhouse_default) as "judge0";
# nothing is published to the internet. Start the platform stack first so that network exists.
name: judge0
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 50m
services:
  server:
    image: judge0/judge0:1.13.1
    volumes: ["./judge0.conf:/judge0.conf:ro"]
    privileged: true          # required by Judge0's isolate sandbox; see docs (security notes)
    networks:
      default: {}
      lh:
        aliases: [judge0]
    <<: *default-logging
    restart: always
  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes: ["./judge0.conf:/judge0.conf:ro"]
    privileged: true
    <<: *default-logging
    restart: always
  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes: ["data:/var/lib/postgresql/data/"]
    <<: *default-logging
    restart: always
  redis:
    image: redis:7.2.4
    command: ["bash","-c",'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    <<: *default-logging
    restart: always
volumes:
  data:
networks:
  lh:
    external: true
    name: learnhouse_default
