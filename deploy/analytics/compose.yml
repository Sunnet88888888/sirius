# Analytics stack: ClickHouse plus the small proxy the platform talks to.
# Included from the platform's docker-compose.yml (`include: [analytics/compose.yml]`).
# Needs these variables in the platform's .env: CLICKHOUSE_USER, CLICKHOUSE_PASSWORD,
# LEARNHOUSE_TINYBIRD_INGEST_TOKEN, LEARNHOUSE_TINYBIRD_READ_TOKEN (see README.md).
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/sirius.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  analytics-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      ANALYTICS_INGEST_TOKEN: ${LEARNHOUSE_TINYBIRD_INGEST_TOKEN}
      ANALYTICS_READ_TOKEN: ${LEARNHOUSE_TINYBIRD_READ_TOKEN}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  clickhouse_data:
